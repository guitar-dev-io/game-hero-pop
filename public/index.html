<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ฮีโร่ป๊อป! จับคู่สุดหรรษา</title>
<style>
:root{--s:48px;--gold:#f6d77a;--gold2:#c99a3a;--ink:#2b2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans Thai","Prompt","Sarabun","Leelawadee UI",system-ui,sans-serif;color:#fff;
 background:radial-gradient(ellipse at 50% -10%,#8a6cff 0%,#4a35b8 40%,#1d1550 100%);touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/18px 18px;pointer-events:none}
button{font:inherit;cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
/* ---------- MENU ---------- */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.logo{font-size:clamp(30px,7vw,54px);font-weight:900;line-height:1.05;letter-spacing:.5px;
 background:linear-gradient(180deg,#fff7d1,#f6d77a 50%,#c9892a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #5b2bb5) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.sub{opacity:.85;font-size:14px;margin-top:-6px}
.mascots{display:flex;gap:6px;margin:4px 0}
.mascots svg{width:52px;height:52px;animation:bob 1.6s ease-in-out infinite alternate}
.mascots svg:nth-child(2){animation-delay:.2s}.mascots svg:nth-child(3){animation-delay:.4s}.mascots svg:nth-child(4){animation-delay:.6s}
@keyframes bob{to{transform:translateY(-6px)}}
.path{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.node button{width:70px;height:70px;border-radius:50%;font-size:26px;font-weight:900;color:#5b2bb5;
 background:radial-gradient(circle at 35% 30%,#fffbe6,#f6d77a 55%,#c99a3a);box-shadow:0 0 0 4px #fff3,0 6px 14px rgba(0,0,0,.4);position:relative;font-family:Georgia,serif}
.node button:active{transform:scale(.94)}
.node.locked button{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.node.locked button::after{content:"🔒";position:absolute;right:-4px;bottom:-4px;font-size:18px}
.node .nm{font-size:12px;opacity:.9}
.stars{font-size:14px;letter-spacing:1px;color:#ffd84d;text-shadow:0 1px 2px #000;min-height:18px}
.stars .off{color:#ffffff40}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 22px;border-radius:999px;font-weight:800;font-size:16px;color:#4b2a8f;
 background:linear-gradient(180deg,#ffffff,#e9e2ff);box-shadow:0 4px 0 #a99bdc,0 6px 12px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#fff2b8,#f2c75a);color:#6b3d00;box-shadow:0 4px 0 #b9862a,0 6px 12px rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a99bdc}
.best{font-size:13px;opacity:.85}
/* ---------- GAME ---------- */
#game{align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:8px}
#game.land{flex-direction:row;gap:14px}
.panel{display:flex;flex-direction:column;gap:6px;width:min(100%,520px)}
#game.land .panel{width:220px}
.hudtop{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#ffffff22;color:#fff;font-size:18px;font-weight:900;flex:none;box-shadow:inset 0 0 0 2px #ffffff44}
.stagename{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:linear-gradient(180deg,#ffffff1f,#ffffff0d);border:1px solid #ffffff33;border-radius:14px;padding:8px 10px}
.row2{display:flex;gap:6px}
#game:not(.land) .row2 .card{flex:1}
#game.land .row2{flex-direction:column}
.lbl{font-size:12px;opacity:.8}
.big{font-size:clamp(17px,5vw,24px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#00000055;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .25s}
#scoreBar i{background:linear-gradient(90deg,#ffd84d,#ff8a3d)}
#timeBar i{background:linear-gradient(90deg,#57e0ff,#7b6bff)}
#timeBar.low i{background:linear-gradient(90deg,#ff5d5d,#ff9a5d)}
.powers{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.pw{font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;animation:pulse .8s infinite alternate}
.pw.ember{background:#ff5a2b}.pw.frost{background:#2fa8e8}
#boardWrap{position:relative;flex:none}
#board{position:relative;touch-action:none;clip-path:inset(-14px round 20px)}
#board.aim .frame{box-shadow:0 0 0 6px #7dfcff,0 0 0 9px #2b8a9a,0 0 26px #7dfcff}
#board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.items{display:flex;gap:8px;justify-content:center}
#game.land .items{flex-direction:column}
.item{position:relative;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:14px;color:#fff;font-weight:700;font-size:13px;
 background:linear-gradient(180deg,#ffffff26,#ffffff10);box-shadow:inset 0 0 0 2px #ffffff40;flex:1;max-width:170px}
#game.land .item{max-width:none}
.item svg{width:38px;height:38px;flex:none}
.item .cnt{position:absolute;top:-6px;right:-4px;background:#ff4f7b;border-radius:999px;font-size:12px;padding:1px 7px;box-shadow:0 1px 3px #0007}
.item.on{box-shadow:inset 0 0 0 3px #7dfcff,0 0 16px #7dfcff;background:#7dfcff33}
.item:disabled{opacity:.4}
.hint{font-size:12px;opacity:.85;text-align:center;min-height:16px}
/* pieces */
.pc{z-index:2;position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .16s cubic-bezier(.45,.05,.55,1.15);will-change:transform}
.pc svg{position:absolute;left:6%;top:6%;width:88%;height:88%;pointer-events:none}
.pc.pop svg,.pc.pop .lvb,.pc.pop .hp,.pc.pop .hpn{animation:pop .28s forwards}
.pc.eaten svg{animation:eaten .4s forwards}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes eaten{100%{transform:scale(0) rotate(240deg);opacity:0;filter:brightness(0)}}
.pc.nudge svg{animation:nudge .3s}
@keyframes nudge{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pc.up svg{animation:upg .5s}
@keyframes upg{40%{transform:scale(1.35);filter:brightness(1.6)}}
.pc.sel svg{transform:scale(1.12);filter:brightness(1.2) drop-shadow(0 0 6px #fff)}
.hero.lv2::before{content:"";position:absolute;inset:3%;border-radius:50%;box-shadow:0 0 10px 3px #9ff7ff,inset 0 0 8px #9ff7ff;animation:pulse .9s infinite alternate}
.hero.lv3::before{content:"";position:absolute;inset:1%;border-radius:50%;
 background:conic-gradient(#ff5f6d,#ffc371,#47ff9a,#4fc3ff,#b36bff,#ff5f6d);animation:spin 1.6s linear infinite;
 -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.lvb{position:absolute;right:0;bottom:0;width:36%;height:36%;border-radius:50%;background:#fff;color:#5b2bb5;font-weight:900;
 font-size:calc(var(--s)*.24);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0008;z-index:2}
.hero.lv3 .lvb{background:linear-gradient(135deg,#ffd84d,#ff6fd8);color:#fff}
.obs .hp{position:absolute;left:14%;right:14%;bottom:3%;height:9%;background:#000a;border-radius:4px;overflow:hidden}
.obs .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffb347)}
.hpn{position:absolute;top:0;right:2%;font-size:calc(var(--s)*.22);font-weight:900;text-shadow:0 0 3px #000,0 0 3px #000}
.obs.hit svg{animation:hit .25s}
@keyframes hit{30%{transform:translateX(-8%) scale(.92);filter:brightness(2)}70%{transform:translateX(8%)}}
.obs.boss svg{filter:drop-shadow(0 0 5px #ff4fd8)}
.obs.lizard svg{animation:bob .5s infinite alternate}
/* fx */
.fxc{position:absolute;left:0;top:0;width:var(--s);height:var(--s)}
.fxc::after{content:"";position:absolute;inset:0;border-radius:50%;animation:burst .45s forwards}
.fxc.c0::after{background:radial-gradient(circle,#fff,#5cd0ff 45%,transparent 70%)}
.fxc.c1::after{background:radial-gradient(circle,#fff,#fff1c4 45%,transparent 70%)}
.fxc.c2::after{background:radial-gradient(circle,#fff,#ffd43b 45%,transparent 70%)}
.fxc.c3::after{background:radial-gradient(circle,#fff,#c27bff 45%,transparent 70%)}
.fxc.dark::after{background:radial-gradient(circle,#000,#5b1a7a 50%,transparent 72%)}
.fxc.fire::after{background:radial-gradient(circle,#fff,#ff6a2b 45%,transparent 70%)}
.fxc.ice::after{background:radial-gradient(circle,#fff,#7de3ff 45%,transparent 70%)}
.fxc.boom::after{background:radial-gradient(circle,#fff,#ffb02e 40%,#ff4f7b 60%,transparent 72%)}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--s)*.42);white-space:nowrap;color:#fff;
 text-shadow:0 2px 0 #5b2bb5,0 0 6px #000;animation:floatup 1s forwards;z-index:6}
.ft.gold{color:#ffe36b;font-size:calc(var(--s)*.55)}
.ft.big{font-size:calc(var(--s)*.7);color:#ffe36b}
.ft.red{color:#ff8a8a}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.drone{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .35s cubic-bezier(.5,0,.6,1);z-index:6}
.drone svg{width:100%;height:100%}
/* modals */
.modal{position:fixed;inset:0;background:#0b0620cc;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}
.sheet{background:linear-gradient(180deg,#fffaf0,#f3e7cf);color:var(--ink);border-radius:22px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;
 box-shadow:0 0 0 4px #f6d77a,0 0 0 7px #8a6a2a,0 20px 50px #000a;text-align:center}
.sheet h2{margin:0 0 8px;font-size:24px;color:#5b2bb5}
.sheet .bigstars{font-size:40px;color:#ffc42e;text-shadow:0 2px 0 #b9862a;letter-spacing:4px}
.sheet .bigstars .off{color:#d8cdb6;text-shadow:none}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;background:#e6dcc4;color:#6b5a3a;font-weight:800}
.tab.on{background:#5b2bb5;color:#fff}
.gl{display:flex;flex-direction:column;gap:8px;text-align:left}
.gi{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 1px 3px #0002}
.gi svg{width:46px;height:46px;flex:none}
.gi b{color:#5b2bb5}
.gi p{margin:2px 0 0;font-size:13px;line-height:1.45}
.gi em{font-style:normal;color:#e8590c;font-weight:700}
.intro-obs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.intro-obs div{display:flex;flex-direction:column;align-items:center;font-size:12px}
.intro-obs svg{width:44px;height:44px}
.namebox{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-size:16px;padding:6px 12px;border-radius:999px;border:2px solid #f6d77a;background:#ffffff1a;color:#fff;width:170px;text-align:center;user-select:text;-webkit-user-select:text}
.namebox input::placeholder{color:#ffffff88}
.net{font-size:12px;padding:3px 9px;border-radius:999px;background:#ffffff22}
.net.on{background:#2fbf71}
.lb{width:100%;border-collapse:collapse;font-size:15px}
.lb th{font-size:12px;color:#8a7a5a;font-weight:700;padding:4px}
.lb td{padding:7px 6px;border-top:1px solid #e6dcc4}
.lb td:nth-child(3){text-align:right;font-weight:800;color:#5b2bb5;font-variant-numeric:tabular-nums}
.lb td:nth-child(2){text-align:left}
.lb tr.me td{background:#fff2b8}
#lbTabs .tab,#lbSub .tab{font-size:13px;padding:6px 10px}
/* ---- stage map ---- */
#menu{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;padding:10px 14px 14px;overflow-y:auto;overflow-x:hidden;text-align:center}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo.sm{font-size:clamp(22px,5.5vw,32px);text-align:left}
.wallet{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chipv{background:#0006;border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;box-shadow:inset 0 0 0 1.5px #ffffff40;font-variant-numeric:tabular-nums}
.chipv svg{width:22px;height:22px}
.mtitle{font-size:clamp(26px,6.5vw,44px);font-weight:900;text-align:left;line-height:1.1;color:#fff;text-shadow:0 3px 0 #3b2a9a,0 0 18px #b49bff}
.mpills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#2a1f6bcc;border:1px solid #ffffff33;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#fff}
.qbtn{width:30px;padding:0;font-size:16px;font-weight:900}
.stagearea{position:relative;flex:1 0 auto;min-height:clamp(330px,52vh,520px);width:100%;max-width:960px;margin:0 auto}
.medal{position:absolute;transform:translate(-50%,-50%);width:clamp(108px,27vw,160px);aspect-ratio:1;cursor:pointer;background:none;padding:0;color:inherit}
.medal .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 32%,#fffbe0,#f6d77a 52%,#c99a3a 88%);box-shadow:0 0 0 5px #fff5,0 0 0 9px #ffffff18,0 12px 26px #0008}
.medal .disc::after{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,#ffffff00 55%,#fff6 56%,#ffffff00 60%)}
.medal .chest{position:absolute;left:14%;right:14%;top:12%;height:52%}
.medal .chest svg,.medal .chk svg{width:100%;height:100%;overflow:visible}
.medal .cnt{position:absolute;right:16%;top:44%;font-weight:900;font-size:clamp(16px,4vw,22px);color:#2a1660;text-shadow:0 0 3px #fff}
.medal .chk{position:absolute;left:30%;right:22%;top:18%;height:40%}
.medal .rib{position:absolute;left:-16%;right:-16%;bottom:4%;height:23%;background:linear-gradient(180deg,#6b9bff,#3653c8);color:#fff;font-weight:900;
 display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.4vw,18px);text-shadow:0 2px 0 #1c2d7a;
 clip-path:polygon(0 18%,9% 0,91% 0,100% 18%,94% 50%,100% 82%,91% 100%,9% 100%,0 82%,6% 50%)}
.medal .tg{position:absolute;left:-30%;right:-30%;bottom:28%;text-align:center;font-size:clamp(10px,2.6vw,12px);font-weight:800;color:#4a2400;text-shadow:0 0 4px #fff,0 0 4px #fff;white-space:nowrap}
.medal .tg b{color:#e8590c}
.medal .st{position:absolute;top:-12%;left:0;right:0;font-size:15px;letter-spacing:1px;color:#ffd84d;text-shadow:0 1px 2px #000}
.medal .st .off{color:#ffffff38}
.medal .lockt{position:absolute;left:0;right:0;top:58%;font-weight:900;font-size:clamp(10px,2.6vw,13px);color:#5a4320;text-shadow:0 0 4px #fff8}
.medal.locked .disc{filter:saturate(.5) brightness(.72)}
.medal.locked .chest{filter:saturate(.5) brightness(.8)}
.medal.sel{z-index:3;animation:mfloat 1.4s ease-in-out infinite alternate}
.medal.sel .disc{box-shadow:0 0 0 5px #fff,0 0 36px 12px #ffe36bcc,0 12px 26px #0008}
@keyframes mfloat{from{transform:translate(-50%,-50%) scale(1.06)}to{transform:translate(-50%,-56%) scale(1.1)}}
.medal.final{width:clamp(170px,42vw,250px)}
.medal.final .disc{background:radial-gradient(circle at 40% 32%,#b9a6ff,#6a4fd0 55%,#3b2a9a 90%)}
.medal.final .inf{position:absolute;inset:14% 0 40%;display:flex;align-items:center;justify-content:center;font-size:clamp(60px,15vw,96px);font-weight:900;color:#ffd84d;text-shadow:0 4px 0 #8a5a00,0 0 18px #ffd84d;font-family:Georgia,serif}
.medal.final .lockt{color:#fff;text-shadow:0 1px 3px #000}
.medal.final .rib{background:linear-gradient(180deg,#f6d77a,#b9862a);color:#5a2a00;text-shadow:none}
.emb{position:absolute;left:1%;bottom:1%;width:clamp(70px,16vw,110px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffe36b55,transparent 70%);pointer-events:none}
.emb svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #ffe36b)}
.trophy{position:absolute;left:0;bottom:4%;width:clamp(120px,32vw,230px);aspect-ratio:3/4;pointer-events:none}
.trophy .tb{position:absolute;filter:sepia(1) saturate(2.6) hue-rotate(-12deg) brightness(1.08) drop-shadow(0 4px 6px #0006)}
.trophy .ped{position:absolute;left:10%;right:10%;bottom:0;height:24%;background:linear-gradient(180deg,#f6d77a,#9a6a1a);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);box-shadow:inset 0 6px 0 #fff6}
.chbar{display:flex;align-items:center;justify-content:center;gap:6px}
.arrow{background:none;color:#ffe9a8;font-size:28px;padding:4px 8px;text-shadow:0 0 10px #ffd84d}
.arrow:disabled{opacity:.25}
.chips{display:flex;align-items:center}
.chips i{width:clamp(8px,3vw,22px);height:5px;background:#ffd84d}
.chips i.off{background:#ffffff30}
.chip{width:clamp(36px,10vw,48px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6a5ae0,#2a1f6b);border:3px solid #c99a3a;font-family:Georgia,serif;font-weight:900;font-size:clamp(14px,4vw,20px);color:#fff;position:relative;transition:transform .2s;padding:0}
.chip.done span{opacity:.35}
.chip.done::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#4be08c;font-size:clamp(22px,6vw,30px);font-family:system-ui;text-shadow:0 2px 0 #0a6a3a}
.chip.on{transform:scale(1.28);border-color:#ffe36b;box-shadow:0 0 16px #ffe36b;z-index:1}
.chip.lock{filter:brightness(.6)}
.mbtns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.bigbtn{position:relative;padding:12px 24px;border-radius:16px;font-size:clamp(16px,4.4vw,20px);font-weight:900;color:#4b5bd0;background:linear-gradient(180deg,#ffffff,#e5e9ff);box-shadow:0 0 0 3px #f6d77a,0 5px 0 #8f7fd0,0 8px 16px #0006;min-width:150px}
.bigbtn.gold{color:#6b3d00;background:linear-gradient(180deg,#fff6cf,#f2c75a)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 0 0 3px #f6d77a,0 2px 0 #8f7fd0}
.bigbtn .dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff4f7b;box-shadow:0 0 0 2px #fff;display:none}
.bigbtn .dot.on{display:block}
.mfoot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
.btnrow.sm .btn{padding:7px 14px;font-size:13px}
.miss{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 1px 3px #0002;text-align:left}
.miss .rw{display:flex;gap:4px;flex:none}
.rwi{position:relative;width:38px;height:38px;border-radius:10px;background:#efe6ff;display:flex;align-items:center;justify-content:center}
.rwi svg{width:30px;height:30px}
.rwi b{position:absolute;right:-3px;bottom:-5px;font-size:12px;color:#2a1660;background:#fff;border-radius:6px;padding:0 4px;box-shadow:0 1px 2px #0003}
.miss .mt{flex:1;font-size:14px;font-weight:700;color:var(--ink)}
.miss .mt small{display:block;font-weight:500;opacity:.7}
.miss .cb{padding:7px 16px;border-radius:999px;font-weight:800;background:linear-gradient(#fff6cf,#f2c75a);color:#6b3d00;box-shadow:0 2px 0 #b9862a;flex:none}
.miss .cb:disabled{background:#e6dcc4;color:#9a8a6a;box-shadow:none}
.invrow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.resreward{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0;font-weight:800;color:#5b2bb5}

function findGroups(){
 const runs=[];
 for(let r=0;r<H;r++){let c=0;while(c<W){const p=grid[r][c];if(!isHero(p)){c++;continue;}let e=c+1;while(e<W&&isHero(grid[r][e])&&grid[r][e].type===p.type)e++;
  if(e-c>=3){const cs=[];for(let k=c;k<e;k++)cs.push(idx(r,k));runs.push(cs);}c=e;}}
 for(let c=0;c<W;c++){let r=0;while(r<H){const p=grid[r][c];if(!isHero(p)){r++;continue;}let e=r+1;while(e<H&&isHero(grid[e][c])&&grid[e][c].type===p.type)e++;
  if(e-r>=3){const cs=[];for(let k=r;k<e;k++)cs.push(idx(k,c));runs.push(cs);}r=e;}}
 if(!runs.length) return [];
 const par=new Map();const find=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
 for(const run of runs)for(const i of run)if(!par.has(i))par.set(i,i);
 for(const run of runs)for(let k=1;k<run.length;k++){const a=find(run[0]),b=find(run[k]);if(a!==b)par.set(a,b);}
 const gs=new Map();
 for(const run of runs){const root=find(run[0]);if(!gs.has(root))gs.set(root,{cells:new Set(),maxRun:0,type:at(run[0]).type});const g=gs.get(root);run.forEach(i=>g.cells.add(i));g.maxRun=Math.max(g.maxRun,run.length);}
 return [...gs.values()];
}
function groupsToPending(groups,prefer=[]){
 const pend={clear:new Set(),triggers:[],create:[]};
 for(const g of groups){
  const lv=g.maxRun>=5?3:(g.maxRun>=4||g.cells.size>=5?2:1);
  if(lv>1){let pos=prefer.find(i=>g.cells.has(i)&&at(i).lv===1);
   if(pos===undefined){const l1=[...g.cells].filter(i=>at(i).lv===1);if(l1.length)pos=l1[Math.floor(l1.length/2)];}
   if(pos!==undefined)pend.create.push({i:pos,lv});}
  g.cells.forEach(i=>pend.clear.add(i));
 }
 pend.create.forEach(cr=>pend.clear.delete(cr.i));
 return pend;
}
const sameAt=(r,c,t)=>inB(r,c)&&isHero(grid[r][c])&&grid[r][c].type===t;
function matchAt(r,c){const p=grid[r][c];if(!isHero(p))return false;const t=p.type;
 let n=1;for(let k=c-1;sameAt(r,k,t);k--)n++;for(let k=c+1;sameAt(r,k,t);k++)n++;if(n>=3)return true;
 n=1;for(let k=r-1;sameAt(k,c,t);k--)n++;for(let k=r+1;sameAt(k,c,t);k++)n++;return n>=3;}
function hasMoves(){
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];if(isHero(p)&&p.lv>1)return true;}
 for(let r=0;r<H;r++)for(let c=0;c<W;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;
  const a=grid[r][c],b=grid[r2][c2];if(!isHero(a)||!isHero(b)||a.type===b.type)continue;
  grid[r][c]=b;grid[r2][c2]=a;const ok=matchAt(r,c)||matchAt(r2,c2);grid[r][c]=a;grid[r2][c2]=b;if(ok)return true;}
 return false;
}

 const mult=(1+Math.min(2,G.chain/60))*(G.fever>0?2:1);let gained=0,sr=0,sc=0,n=0;
 for(const i of clear){const[r,c]=rc(i);const p=grid[r][c];if(!p)continue;grid[r][c]=null;popEl(p);{const[x,y]=boardXY(r,c);burst(x,y,PCOL[p.type],clear.size>20?4:7,3.5);if(p.lv>1)ring(x,y,PCOL[p.type][0],1.5);}
  gained+=Math.round(100*mult*(p.lv>1?2:1));G.stats.blob+=Math.round(100*mult*(p.lv>1?2:1));G.stats.steps++;sr+=r;sc+=c;n++;}
 if(n)beep(400+cascade*120,.09,'sine',.05);
 if(n>=15){shake(Math.min(12,n/3));flash();}
 if(n&&G.fever<=0){G.fg+=n*.55;if(G.fg>=100){G.fg=0;startFever();}}
 for(const cr of pend.create){const p=at(cr.i);if(isHero(p)){p.lv=Math.max(p.lv,cr.lv);render(p);flashClass(p,'up',500);cellFx(p.r,p.c,'c'+p.type);gained+=Math.round(cr.lv*250*mult);{const[x,y]=boardXY(p.r,p.c);ring(x,y,'#fff',1.4);burst(x,y,['#fff','#ffe36b'],12,3,{shape:'star'});}}}
 if(pend.create.length)beep(990,.18,'triangle',.05);
 if(gained){addScore(gained);if(n)floatText((sc/n+.5)*S,(sr/n+.5)*S,'+'+gained);}
 if(timeBonus)addTime(timeBonus);

async function gravity(){

   let a=r;while(a-1>=0&&on(a-1,c)&&!isWall(grid[a-1][c]))a--;
   let w=r;
   for(let k=r;k>=a;k--){const p=grid[k][c];if(p){if(w!==k){grid[w][c]=p;grid[k][c]=null;const d=.1+.045*(w-k);maxD=Math.max(maxD,d);setPos(p,w,c,d);}w--;}}
   let open=true;for(let k=a-1;k>=0;k--)if(on(k,c)){open=false;break;}
   if(open){const n=w-a+1;for(let k=w;k>=a;k--){const p=newHero(rnd(4),G&&G.fever>0&&Math.random()<.03?2:1);grid[k][c]=p;render(p);setPosInstant(p,k-n-1,c);const d=.1+.045*(n+1);maxD=Math.max(maxD,d);setPos(p,k,c,d);}}
   else for(let k=w;k>=a;k--){const p=newHero(rnd(4));grid[k][c]=p;render(p);setPosInstant(p,k,c);flashClass(p,'up',500);}
   r=a-1;}
 }

   const stars=[0,1,2].map(n=>n<SAVE.stars[i]?'★':'<span class="off">★</span>').join('');
   h+=`<button class="medal${lock?' locked':''}${sel?' sel':''}" data-i="${i}" style="left:${POS[k][0]}%;top:${POS[k][1]}%">
    <span class="disc"></span><span class="chest">${chestSVG(SAVE.claimed[i])}</span><span class="cnt">${st.chest}</span>
    ${done?`<span class="chk">${CHECK_SVG}</span>`:''}${lock?'<span class="lockt">ยังไม่ปลดล็อก 🔒</span>':''}
    ${sel&&!lock?`<span class="tg">เป้าหมายด่านนี้: <b>${(SAVE.bestS[i]||0).toLocaleString()}</b>/${st.target.toLocaleString()}</span>`:''}
    ${!lock?`<span class="st">${stars}</span>`:''}<span class="rib">ด่านที่ ${st.label}</span></button>`;}
 }else{
  const lock=!unlocked(LAST);
  h+=`<div class="trophy">${[[33,2,34],[22,20,52],[0,42,52],[46,42,52]].map(([x,y,w],k)=>`<div class="tb" style="left:${x}%;top:${y}%;width:${w}%">${HERO_SVG[(k+2)%4]}</div>`).join('')}<div class="ped"></div></div>
   <button class="medal final${lock?' locked':''} sel" data-i="${LAST}" style="left:62%;top:46%"><span class="disc"></span><span class="inf">∞</span>
   ${lock?'<span class="lockt">ยังไม่ปลดล็อก 🔒<br>ผ่านด่านที่ 5-4 ก่อน</span>':`<span class="lockt">สถิติ ${SAVE.best.toLocaleString()}</span>`}<span class="rib">ด่านสุดท้าย</span></button>`;
 }
 $('#stageArea').innerHTML=h;
 $('#stageArea').querySelectorAll('.medal').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(!unlocked(i)){toast(i===LAST?'ผ่านด่านที่ 5-4 เพื่อปลดล็อกด่านสุดท้าย':'ผ่านด่านก่อนหน้าเพื่อปลดล็อก');return;}
  if(selSt===i){startStage(i);return;}selSt=i;beep(700,.06);buildMenu();});
 $('#chips').innerHTML=['I','II','III','IV','V','∞'].map((n,c)=>`${c?`<i class="${chDone(c-1)?'':'off'}"></i>`:''}<button class="chip${c===selCh?' on':''}${chDone(c)?' done':''}${unlocked(c<5?c*4:LAST)?'':' lock'}" data-c="${c}"><span>${n}</span></button>`).join('');
 $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>setCh(+b.dataset.c));
 $('#chPrev').disabled=selCh===0;$('#chNext').disabled=selCh===5;
 $('#playBtn').textContent=unlocked(selSt)&&STAGES[selSt].ch===selCh?`เริ่มการท้าทาย ${STAGES[selSt].label}`:'เริ่มการท้าทาย';
 $('#missDot').classList.toggle('on',missionsReady()>0);
 $('#bestTxt').textContent=SAVE.best?'🏆 สถิติด่านสุดท้าย: '+SAVE.best.toLocaleString():'';
 $('#cutBtn').textContent=SAVE.cutins===false?'🎬 ฉากสกิล: ปิด':'🎬 ฉากสกิล: เปิด';
 $('#muteBtn').textContent=SAVE.muted?'🔇 เสียง: ปิด':'🔊 เสียง: เปิด';
}
function setCh(c){selCh=Math.max(0,Math.min(5,c));if(selCh===5)selSt=LAST;else{let i=selCh*4;for(let k=0;k<4;k++){const j=selCh*4+k;if(unlocked(j))i=j;if(unlocked(j)&&!(SAVE.stars[j]>0))break;}selSt=i;}beep(600,.05);buildMenu();}
$('#chPrev').onclick=()=>setCh(selCh-1);$('#chNext').onclick=()=>setCh(selCh+1);
$('#playBtn').onclick=()=>{if(STAGES[selSt].ch!==selCh||!unlocked(selSt)){toast(selCh===5?'ผ่านด่านที่ 5-4 เพื่อปลดล็อกด่านสุดท้าย':'ด่านนี้ยังไม่ปลดล็อก');return;}startStage(selSt);};
/* ---- missions ---- */
const DAILY=[
 {id:'login',t:'ล็อกอิน',need:1,rw:{coin:20,bolt:1}},
 {id:'play',t:'เล่นด่านใดก็ได้ 1 เกม',need:1,rw:{coin:30,bomb:1}},
 {id:'skill',t:'ใช้สกิลฮีโร่ 5 ครั้ง',need:5,rw:{coin:30,clock:1}},
 {id:'fever',t:'เข้าโหมด FEVER 1 ครั้ง',need:1,rw:{coin:40,bolt:1}}];
const cleared=()=>SAVE.stars.filter(x=>x>0).length,starSum=()=>SAVE.stars.reduce((a,b)=>a+b,0);
const SEASON=[
 {id:'c5',t:'ผ่านด่าน 5 ด่าน',need:5,p:cleared,rw:{coin:100,bolt:2}},
 {id:'c20',t:'ผ่านครบทั้ง 20 ด่าน',need:20,p:cleared,rw:{coin:300,clock:2}},
 {id:'s30',t:'สะสมดาว 30 ดวง',need:30,p:starSum,rw:{coin:200,bomb:3}},
 {id:'s60',t:'สะสมดาวครบ 60 ดวง',need:60,p:starSum,rw:{coin:500,bolt:3,clock:2}},
 {id:'b3',t:'ปราบจอมมารเงา 3 ครั้ง',need:3,p:()=>SAVE.season.boss,rw:{coin:150,bolt:2,bomb:1}}];
const SHOP=[{k:'bolt',price:60},{k:'clock',price:100},{k:'bomb',price:60}];
let missTab='d';
function mState(m,daily){const prog=daily?(SAVE.daily.prog[m.id]||0):m.p();const got=daily?SAVE.daily.got[m.id]:SAVE.season.got[m.id];return{prog:Math.min(prog,m.need),got,ready:!got&&prog>=m.need};}
function missionsReady(){ensureDaily();return DAILY.filter(m=>mState(m,true).ready).length+SEASON.filter(m=>mState(m,false).ready).length;}
function claim(m,daily){const s=mState(m,daily);if(!s.ready)return false;(daily?SAVE.daily.got:SAVE.season.got)[m.id]=true;grant(m.rw);return true;}
function renderMiss(){
 ensureDaily();document.querySelectorAll('#missTabs .tab').forEach(x=>x.classList.toggle('on',x.dataset.m===missTab));
 let h='';
 if(missTab==='x'){h=SHOP.map(x=>`<div class="miss"><div class="rw"><span class="rwi">${ITEM_SVG[x.k]}<b>1</b></span></div><div class="mt">${ITEMS[x.k].name}<small>${ITEMS[x.k].desc.replace(/<[^>]+>/g,'')}</small></div><button class="cb" data-buy="${x.k}" ${SAVE.coins<x.price?'disabled':''}>🪙 ${x.price}</button></div>`).join('');}
 else{const list=missTab==='d'?DAILY:SEASON;h=list.map(m=>{const s=mState(m,missTab==='d');
  return `<div class="miss"><div class="rw">${rewardHTML(m.rw)}</div><div class="mt">${m.t} (${s.prog}/${m.need})</div><button class="cb" data-id="${m.id}" ${s.ready?'':'disabled'}>${s.got?'รับแล้ว':'รับ'}</button></div>`;}).join('');}
 $('#missList').innerHTML=h;
 $('#invRow').innerHTML=`<span class="chipv" style="color:#fff">${COIN_SVG}${SAVE.coins}</span>`+ITEM_KEYS.map(k=>`<span class="chipv" style="color:#fff">${ITEM_SVG[k]}${SAVE.inv[k]}</span>`).join('');
 $('#claimAll').style.display=missTab==='x'?'none':'';
 $('#missList').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const list=missTab==='d'?DAILY:SEASON;const m=list.find(x=>x.id===b.dataset.id);if(claim(m,missTab==='d')){beep(900,.15,'triangle');confetti(30);renderMiss();buildMenu();}});
 $('#missList').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const x=SHOP.find(q=>q.k===b.dataset.buy);if(SAVE.coins<x.price)return;SAVE.coins-=x.price;SAVE.inv[x.k]++;save();beep(900,.1,'triangle');toast('ได้รับ '+ITEMS[x.k].name+' 1 ชิ้น');renderMiss();buildMenu();});
}
$('#missBtn').onclick=()=>{missTab='d';renderMiss();modal('missM',true);};
$('#closeMiss').onclick=()=>modal('missM',false);
document.querySelectorAll('#missTabs .tab').forEach(t=>t.onclick=()=>{missTab=t.dataset.m;renderMiss();});
$('#claimAll').onclick=()=>{let n=0;const d=missTab==='d';(d?DAILY:SEASON).forEach(m=>{if(claim(m,d))n++;});if(n){beep(900,.2,'triangle');confetti(60);toast(`รับรางวัล ${n} ภารกิจ`);}else toast('ยังไม่มีรางวัลให้รับ');renderMiss();buildMenu();};
function toMenu(){G=null;busy=false;['pauseM','resultM','introM'].forEach(m=>modal(m,false));selSt=defaultStage();selCh=STAGES[selSt].ch;buildMenu();show('menu');}
$('#cutBtn').onclick=()=>{SAVE.cutins=SAVE.cutins===false;save();buildMenu();};
$('#muteBtn').onclick=()=>{SAVE.muted=!SAVE.muted;save();buildMenu();};
$('#backBtn').onclick=$('#pauseBtn').onclick=()=>{if(!G||G.ended)return;G.paused=true;modal('pauseM',true);};
$('#resumeBtn').onclick=()=>{G.paused=false;modal('pauseM',false);};
$('#restartBtn').onclick=()=>{modal('pauseM',false);startStage(stageIdx);};
$('#quitBtn').onclick=toMenu;
$('#menuBtn').onclick=toMenu;
$('#shareBtn').onclick=()=>{const st=STAGES[stageIdx];const txt=`ฉันทำได้ ${Number(SAVE.bestS[stageIdx]||0).toLocaleString()} คะแนน คอมโบสูงสุด ${SAVE.maxC?SAVE.maxC[stageIdx]:0} ใน${st.name} ของ "ฮีโร่ป๊อป!" มาท้าทายกัน! ${location.href.startsWith('http')?location.href:''}`;
 try{navigator.clipboard.writeText(txt).then(()=>toast('คัดลอกข้อความแล้ว นำไปแชร์ได้เลย'),()=>toast(txt));}catch(e){toast(txt);}};
$('#againBtn').onclick=()=>{modal('resultM',false);startStage(stageIdx);};
$('#nextBtn').onclick=()=>{modal('resultM',false);startStage(Math.min(stageIdx+1,LAST));};

let helpWasPaused=false;
function openHelp(){if(G&&G.running){helpWasPaused=G.paused;G.paused=true;}renderGuide('h');modal('helpM',true);}
$('#helpBtn').onclick=$('#helpBtn2').onclick=openHelp;
$('#closeHelp').onclick=()=>{modal('helpM',false);if(G&&G.running&&!$('#pauseM').classList.contains('on'))G.paused=helpWasPaused;};
document.querySelectorAll('#helpM .tab').forEach(t=>t.onclick=()=>renderGuide(t.dataset.t));
function renderGuide(t){
 document.querySelectorAll('#helpM .tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
 let h='';
 if(t==='h'){h+=`<div class="gi"><div><b>พื้นฐาน</b><p>ลากสลับลูกอมที่อยู่ติดกันให้เรียงชนิดเดียวกัน <em>3 ลูก</em> ขึ้นไปเพื่อทำลาย<br>เรียง <em>4 ลูก</em> (หรือรูปตัว L/T) = ได้ลูกอม <em>Lv.2</em> • เรียง <em>5 ลูก</em> = ได้ลูกอม <em>Lv.3</em><br>แตะลูกอม Lv.2/3 เพื่อใช้สกิล หรือลากสลับเพื่อเลือกทิศทาง • คอมโบต่อเนื่องได้คะแนนคูณเพิ่ม (สูงสุด x3)</p></div></div><div class="gi"><div><b>🧮 การคิดคะแนน</b><p>ลูกอม 100 (ลูกอมพิเศษ 200) • สร้าง Lv.2/Lv.3 ได้ 500/750 • ปราบสิ่งกีดขวางตามที่ระบุ<br>ทุกอย่างคูณด้วย <em>คอมโบต่อเนื่อง</em> (สูงสุด x3) และ <em>FEVER x2</em> เหมือนกันหมด • เวลาหยุดเดินระหว่างฉากสกิล • เวลาโบนัสรวมได้สูงสุด +20 วิ ต่อด่าน</p></div></div><div class="gi"><div><b>🔥 คอมโบต่อเนื่อง</b><p>ทำลายลูกอมต่อเนื่องภายใน <em>3 วิ</em> คอมโบจะนับขึ้นเรื่อยๆ (วงแหวนข้างตัวเลขคือเวลาที่เหลือ) ยิ่งคอมโบสูงคะแนนยิ่งคูณเพิ่ม สูงสุด <em>x3</em> ที่คอมโบ 120 • คอมโบ 40 ขึ้นไปสนามจะลุกเป็นไฟ!</p></div></div><div class="gi"><div><b>🗺️ รูปแบบกระดาน</b><p>แต่ละด่านมีกระดานต่างกัน ทั้งรูปเพชร กากบาท และแบบแคบ ลังไม้กับพุ่มหญ้าอยู่กับที่ ลูกอมตกผ่านไม่ได้จนกว่าจะทุบทิ้ง • ถาดด้านล่างบอกมอนสเตอร์ที่กำลังจะบุก ลูกแก้วเต็มเมื่อไหร่ มันจะบุกเข้ามา!</p></div></div><div class="gi"><div><b>🌈 FEVER</b><p>ทำลายลูกอมจนเกจเต็ม เข้าโหมด FEVER <em>8 วิ</em>: คะแนน <em>x2</em> และลูกอมที่ตกลงมามีโอกาสเป็น Lv.2</p></div></div><div class="gi"><div><b>💥 สุดยอดคอมโบ</b><p>ลากสลับลูกอม Lv.2/3 สองลูกเข้าหากัน = ระเบิดกากบาทกว้าง 3 แถว<br>สลับ <em>Lv.3 + Lv.3</em> = <em>ล้างทั้งกระดาน!</em></p></div></div>`;
  HEROES.forEach((x,i)=>h+=`<div class="gi">${HERO_SVG[i]}<div><b>${x.name}</b> (${x.col})<p><b>Lv.2:</b> ${x.lv2}<br><b>Lv.3:</b> ${x.lv3}</p></div></div>`);}
 if(t==='o')Object.keys(OBS).forEach(k=>h+=`<div class="gi">${OBS_SVG[k]}<div><b>${OBS[k].name}</b><p>${OBS[k].desc}<br>กำจัดได้ <em>+${OBS[k].pts.toLocaleString()}</em> คะแนน</p></div></div>`);
 if(t==='i'){Object.keys(ITEMS).forEach(k=>h+=`<div class="gi">${ITEM_SVG[k]}<div><b>${ITEMS[k].name}</b><p>${ITEMS[k].desc} เมื่อใช้แล้วไม่สามารถยกเลิกได้</p></div></div>`);
  h+=`<div class="gi"><div><p>ทุกด่านได้ไอเทมฟรีอย่างละ 1 ชิ้น ใช้หมดแล้วจะดึงจากกระเป๋า (ได้จากกล่องสมบัติ ภารกิจ และร้านแลกของ)</p></div></div>`;}
 $('#guide').innerHTML=h;
}
window.addEventListener('focus',()=>{if(!G){buildMenu();}});
$('#bgfloat').innerHTML=Array.from({length:14},(_,k)=>{const sz=30+rnd(60);return HERO_SVG[k%4].replace('<svg ',`<svg style="left:${rnd(100)}%;width:${sz}px;height:${sz}px;animation-duration:${14+rnd(16)}s;animation-delay:-${rnd(30)}s" `);}).join('');
$('#icBolt').innerHTML=ITEM_SVG.bolt;$('#icClock').innerHTML=ITEM_SVG.clock;$('#icBomb').innerHTML=ITEM_SVG.bomb;
/* ================= LEADERBOARD (server or local) ================= */
const NET={online:false};let lbStage=0;
const myName=()=>(($('#nameIn').value||'').trim().slice(0,16))||'ผู้เล่น';
$('#nameIn').value=SAVE.name||'';
$('#nameIn').oninput=()=>{SAVE.name=$('#nameIn').value.trim().slice(0,16);save();};
function setNet(on){NET.online=on;const e=$('#netTxt');e.textContent=on?'🟢 ออนไลน์ (เซิร์ฟเวอร์)':'⚪ ออฟไลน์ (เก็บในเครื่อง)';e.classList.toggle('on',on);}
setNet(false);
if(location.protocol.startsWith('http'))fetch('api/scores?stage=0',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.scores))setNet(true);}).catch(()=>{});
function localBoard(st){try{return JSON.parse(localStorage.getItem('heroPopLB'+st)||'[]');}catch(e){return [];}}
async function submitScore(st,score,stars){
 const entry={name:myName(),stage:st,score,stars,time:Date.now()};
 if(NET.online){try{const r=await fetch('api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
  if(r.ok){const j=await r.json();return j.rank;}}catch(e){}}
 const b=localBoard(st);b.push(entry);b.sort((a,c)=>c.score-a.score);const top=b.slice(0,20);
 try{localStorage.setItem('heroPopLB'+st,JSON.stringify(top));}catch(e){}
 const k=top.indexOf(entry);return k>=0?k+1:0;
}
async function getBoard(st){
 if(NET.online){try{const r=await fetch('api/scores?stage='+st,{cache:'no-store'});if(r.ok)return (await r.json()).scores;}catch(e){}}
 return localBoard(st).slice(0,10);
}
const esc=t=>String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function showLb(st){
 lbStage=st;
 const cur=STAGES[st];
 $('#lbTabs').innerHTML=['I','II','III','IV','V','∞'].map((n,c)=>`<button class="tab${c===cur.ch?' on':''}" data-s="${c<5?c*4+(c===cur.ch?cur.sub:0):LAST}">${n}</button>`).join('');
 $('#lbSub').innerHTML=cur.ch<5?[0,1,2,3].map(k=>`<button class="tab${k===cur.sub?' on':''}" data-s="${cur.ch*4+k}">${cur.ch+1}-${k+1}</button>`).join(''):'';
 document.querySelectorAll('#lbTabs .tab,#lbSub .tab').forEach(b=>b.onclick=()=>showLb(+b.dataset.s));
 $('#lbMode').textContent=STAGES[st].name+(NET.online?' • คะแนนรวมทุกคนบนเซิร์ฟเวอร์':' • คะแนนในเครื่องนี้ (รันเซิร์ฟเวอร์เพื่อแข่งกับเพื่อน)');
 $('#lbBody').innerHTML='<tr><td colspan="4">กำลังโหลด…</td></tr>';
 const rows=await getBoard(st);const me=myName();
 $('#lbBody').innerHTML=rows.length?rows.map((e,i)=>`<tr class="${e.name===me?'me':''}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(e.name)}</td><td>${Number(e.score).toLocaleString()}</td><td>${STAGES[st].endless?'':'★'.repeat(e.stars||0)}</td></tr>`).join(''):'<tr><td colspan="4">ยังไม่มีคะแนน มาเป็นคนแรกกัน!</td></tr>';
 modal('lbM',true);
}
$('#lbBtn').onclick=()=>showLb(selSt);
$('#resLbBtn').onclick=()=>showLb(lbStage);
$('#closeLb').onclick=()=>modal('lbM',false);

buildMenu();
window.__hp={get grid(){return grid},get G(){return G},startStage,doSwap,doTap,act,findGroups,hasMoves,get busy(){return busy}};
})();
</script>
