<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ฮีโร่ป๊อป! จับคู่สุดหรรษา</title>
<style>
:root{--s:48px;--gold:#f6d77a;--gold2:#c99a3a;--ink:#2b2350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans Thai","Prompt","Sarabun","Leelawadee UI",system-ui,sans-serif;color:#fff;
 background:radial-gradient(ellipse at 50% -10%,#8a6cff 0%,#4a35b8 40%,#1d1550 100%);touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/18px 18px;pointer-events:none}
button{font:inherit;cursor:pointer;border:0}
.screen{position:fixed;inset:0;display:none}
.screen.on{display:flex}
/* ---------- MENU ---------- */
#menu{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.logo{font-size:clamp(30px,7vw,54px);font-weight:900;line-height:1.05;letter-spacing:.5px;
 background:linear-gradient(180deg,#fff7d1,#f6d77a 50%,#c9892a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #5b2bb5) drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.sub{opacity:.85;font-size:14px;margin-top:-6px}
.mascots{display:flex;gap:6px;margin:4px 0}
.mascots svg{width:52px;height:52px;animation:bob 1.6s ease-in-out infinite alternate}
.mascots svg:nth-child(2){animation-delay:.2s}.mascots svg:nth-child(3){animation-delay:.4s}.mascots svg:nth-child(4){animation-delay:.6s}
@keyframes bob{to{transform:translateY(-6px)}}
.path{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px}
.node button{width:70px;height:70px;border-radius:50%;font-size:26px;font-weight:900;color:#5b2bb5;
 background:radial-gradient(circle at 35% 30%,#fffbe6,#f6d77a 55%,#c99a3a);box-shadow:0 0 0 4px #fff3,0 6px 14px rgba(0,0,0,.4);position:relative;font-family:Georgia,serif}
.node button:active{transform:scale(.94)}
.node.locked button{filter:grayscale(1) brightness(.7);cursor:not-allowed}
.node.locked button::after{content:"🔒";position:absolute;right:-4px;bottom:-4px;font-size:18px}
.node .nm{font-size:12px;opacity:.9}
.stars{font-size:14px;letter-spacing:1px;color:#ffd84d;text-shadow:0 1px 2px #000;min-height:18px}
.stars .off{color:#ffffff40}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 22px;border-radius:999px;font-weight:800;font-size:16px;color:#4b2a8f;
 background:linear-gradient(180deg,#ffffff,#e9e2ff);box-shadow:0 4px 0 #a99bdc,0 6px 12px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#fff2b8,#f2c75a);color:#6b3d00;box-shadow:0 4px 0 #b9862a,0 6px 12px rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a99bdc}
.best{font-size:13px;opacity:.85}
/* ---------- GAME ---------- */
#game{align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:8px}
#game.land{flex-direction:row;gap:14px}
.panel{display:flex;flex-direction:column;gap:6px;width:min(100%,520px)}
#game.land .panel{width:220px}
.hudtop{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#ffffff22;color:#fff;font-size:18px;font-weight:900;flex:none;box-shadow:inset 0 0 0 2px #ffffff44}
.stagename{font-weight:800;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:linear-gradient(180deg,#ffffff1f,#ffffff0d);border:1px solid #ffffff33;border-radius:14px;padding:8px 10px}
.row2{display:flex;gap:6px}
#game:not(.land) .row2 .card{flex:1}
#game.land .row2{flex-direction:column}
.lbl{font-size:12px;opacity:.8}
.big{font-size:clamp(17px,5vw,24px);font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:6px;background:#00000055;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .25s}
#scoreBar i{background:linear-gradient(90deg,#ffd84d,#ff8a3d)}
#timeBar i{background:linear-gradient(90deg,#57e0ff,#7b6bff)}
#timeBar.low i{background:linear-gradient(90deg,#ff5d5d,#ff9a5d)}
.powers{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.pw{font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;animation:pulse .8s infinite alternate}
.pw.ember{background:#ff5a2b}.pw.frost{background:#2fa8e8}
#boardWrap{position:relative;flex:none}
#board{position:relative;border-radius:14px;overflow:hidden;touch-action:none;
 background:repeating-conic-gradient(#ffffff16 0 25%,#ffffff07 0 50%) 0 0/calc(var(--s)*2) calc(var(--s)*2),linear-gradient(180deg,#6a52e0,#4a35b8);
 box-shadow:0 0 0 4px #f6d77a,0 0 0 7px #8a6a2a,0 12px 30px rgba(0,0,0,.5)}
#board.aim{box-shadow:0 0 0 4px #7dfcff,0 0 0 7px #2b8a9a,0 0 26px #7dfcff}
#board.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.items{display:flex;gap:8px;justify-content:center}
#game.land .items{flex-direction:column}
.item{position:relative;display:flex;align-items:center;gap:6px;padding:6px 10px 6px 6px;border-radius:14px;color:#fff;font-weight:700;font-size:13px;
 background:linear-gradient(180deg,#ffffff26,#ffffff10);box-shadow:inset 0 0 0 2px #ffffff40;flex:1;max-width:170px}
#game.land .item{max-width:none}
.item svg{width:38px;height:38px;flex:none}
.item .cnt{position:absolute;top:-6px;right:-4px;background:#ff4f7b;border-radius:999px;font-size:12px;padding:1px 7px;box-shadow:0 1px 3px #0007}
.item.on{box-shadow:inset 0 0 0 3px #7dfcff,0 0 16px #7dfcff;background:#7dfcff33}
.item:disabled{opacity:.4}
.hint{font-size:12px;opacity:.85;text-align:center;min-height:16px}
/* pieces */
.pc{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .16s cubic-bezier(.45,.05,.55,1.15);will-change:transform}
.pc svg{position:absolute;left:6%;top:6%;width:88%;height:88%;pointer-events:none}
.pc.pop svg,.pc.pop .lvb,.pc.pop .hp,.pc.pop .hpn{animation:pop .28s forwards}
.pc.eaten svg{animation:eaten .4s forwards}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes eaten{100%{transform:scale(0) rotate(240deg);opacity:0;filter:brightness(0)}}
.pc.nudge svg{animation:nudge .3s}
@keyframes nudge{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.pc.up svg{animation:upg .5s}
@keyframes upg{40%{transform:scale(1.35);filter:brightness(1.6)}}
.pc.sel svg{transform:scale(1.12);filter:brightness(1.2) drop-shadow(0 0 6px #fff)}
.hero.lv2::before{content:"";position:absolute;inset:3%;border-radius:50%;box-shadow:0 0 10px 3px #9ff7ff,inset 0 0 8px #9ff7ff;animation:pulse .9s infinite alternate}
.hero.lv3::before{content:"";position:absolute;inset:1%;border-radius:50%;
 background:conic-gradient(#ff5f6d,#ffc371,#47ff9a,#4fc3ff,#b36bff,#ff5f6d);animation:spin 1.6s linear infinite;
 -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%);mask:radial-gradient(circle,transparent 60%,#000 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.lvb{position:absolute;right:0;bottom:0;width:36%;height:36%;border-radius:50%;background:#fff;color:#5b2bb5;font-weight:900;
 font-size:calc(var(--s)*.24);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0008;z-index:2}
.hero.lv3 .lvb{background:linear-gradient(135deg,#ffd84d,#ff6fd8);color:#fff}
.obs .hp{position:absolute;left:14%;right:14%;bottom:3%;height:9%;background:#000a;border-radius:4px;overflow:hidden}
.obs .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffb347)}
.hpn{position:absolute;top:0;right:2%;font-size:calc(var(--s)*.22);font-weight:900;text-shadow:0 0 3px #000,0 0 3px #000}
.obs.hit svg{animation:hit .25s}
@keyframes hit{30%{transform:translateX(-8%) scale(.92);filter:brightness(2)}70%{transform:translateX(8%)}}
.obs.boss svg{filter:drop-shadow(0 0 5px #ff4fd8)}
.obs.lizard svg{animation:bob .5s infinite alternate}
/* fx */
.fxc{position:absolute;left:0;top:0;width:var(--s);height:var(--s)}
.fxc::after{content:"";position:absolute;inset:0;border-radius:50%;animation:burst .45s forwards}
.fxc.c0::after{background:radial-gradient(circle,#fff,#5cd0ff 45%,transparent 70%)}
.fxc.c1::after{background:radial-gradient(circle,#fff,#fff1c4 45%,transparent 70%)}
.fxc.c2::after{background:radial-gradient(circle,#fff,#ffd43b 45%,transparent 70%)}
.fxc.c3::after{background:radial-gradient(circle,#fff,#c27bff 45%,transparent 70%)}
.fxc.dark::after{background:radial-gradient(circle,#000,#5b1a7a 50%,transparent 72%)}
.fxc.fire::after{background:radial-gradient(circle,#fff,#ff6a2b 45%,transparent 70%)}
.fxc.ice::after{background:radial-gradient(circle,#fff,#7de3ff 45%,transparent 70%)}
.fxc.boom::after{background:radial-gradient(circle,#fff,#ffb02e 40%,#ff4f7b 60%,transparent 72%)}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:calc(var(--s)*.42);white-space:nowrap;color:#fff;
 text-shadow:0 2px 0 #5b2bb5,0 0 6px #000;animation:floatup 1s forwards;z-index:6}
.ft.gold{color:#ffe36b;font-size:calc(var(--s)*.55)}
.ft.big{font-size:calc(var(--s)*.7);color:#ffe36b}
.ft.red{color:#ff8a8a}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.drone{position:absolute;left:0;top:0;width:var(--s);height:var(--s);transition:transform .35s cubic-bezier(.5,0,.6,1);z-index:6}
.drone svg{width:100%;height:100%}
/* modals */
.modal{position:fixed;inset:0;background:#0b0620cc;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}
.sheet{background:linear-gradient(180deg,#fffaf0,#f3e7cf);color:var(--ink);border-radius:22px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto;
 box-shadow:0 0 0 4px #f6d77a,0 0 0 7px #8a6a2a,0 20px 50px #000a;text-align:center}
.sheet h2{margin:0 0 8px;font-size:24px;color:#5b2bb5}
.sheet .bigstars{font-size:40px;color:#ffc42e;text-shadow:0 2px 0 #b9862a;letter-spacing:4px}
.sheet .bigstars .off{color:#d8cdb6;text-shadow:none}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;background:#e6dcc4;color:#6b5a3a;font-weight:800}
.tab.on{background:#5b2bb5;color:#fff}
.gl{display:flex;flex-direction:column;gap:8px;text-align:left}
.gi{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 1px 3px #0002}
.gi svg{width:46px;height:46px;flex:none}
.gi b{color:#5b2bb5}
.gi p{margin:2px 0 0;font-size:13px;line-height:1.45}
.gi em{font-style:normal;color:#e8590c;font-weight:700}
.intro-obs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.intro-obs div{display:flex;flex-direction:column;align-items:center;font-size:12px}
.intro-obs svg{width:44px;height:44px}
.namebox{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-size:16px;padding:6px 12px;border-radius:999px;border:2px solid #f6d77a;background:#ffffff1a;color:#fff;width:170px;text-align:center;user-select:text;-webkit-user-select:text}
.namebox input::placeholder{color:#ffffff88}
.net{font-size:12px;padding:3px 9px;border-radius:999px;background:#ffffff22}
.net.on{background:#2fbf71}
.lb{width:100%;border-collapse:collapse;font-size:15px}
.lb th{font-size:12px;color:#8a7a5a;font-weight:700;padding:4px}
.lb td{padding:7px 6px;border-top:1px solid #e6dcc4}
.lb td:nth-child(3){text-align:right;font-weight:800;color:#5b2bb5;font-variant-numeric:tabular-nums}
.lb td:nth-child(2){text-align:left}
.lb tr.me td{background:#fff2b8}
.lb .tab{font-size:13px;padding:6px 10px}
/* ---- wow layer ---- */
#pfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45}
#bgfloat{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#bgfloat svg{position:absolute;opacity:.22;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-30vh) rotate(360deg)}}
.screen{z-index:1}
.node.next button{animation:glowN 1.1s ease-in-out infinite alternate}
@keyframes glowN{from{box-shadow:0 0 0 4px #fff3,0 6px 14px #0006}to{box-shadow:0 0 0 6px #fff8,0 0 28px 6px #ffd84d}}
.hero svg{animation:breathe 2.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 90%}
@keyframes breathe{50%{transform:scale(1.05,.95) translateY(2%)}}
.pc.sel svg{animation:none}
.pc.hint svg{animation:hintA .7s ease-in-out infinite}
@keyframes hintA{50%{transform:scale(1.18);filter:brightness(1.35) drop-shadow(0 0 8px #fff)}}
#boardWrap.shk{animation:shk .35s}
@keyframes shk{15%{transform:translate(var(--sh),calc(var(--sh)*-.6))}35%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.5))}55%{transform:translate(calc(var(--sh)*.6),var(--sh))}75%{transform:translate(calc(var(--sh)*-.4),calc(var(--sh)*-.3))}}
.flash{position:absolute;inset:0;border-radius:14px;z-index:7;pointer-events:none;animation:flashA .4s forwards}
@keyframes flashA{from{opacity:.75}to{opacity:0}}
.banner{position:absolute;left:50%;top:44%;font-size:calc(var(--s)*.95);font-weight:900;white-space:nowrap;z-index:9;pointer-events:none;
 background:linear-gradient(180deg,#fff,#ffe36b 45%,#ff9a1a);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 3px 0 #5b2bb5) drop-shadow(0 0 14px #ff6fd8);animation:bannerIn 1.2s forwards}
.banner.huge{font-size:calc(var(--s)*1.6)}
.banner.fever{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47ff9a,#4fc3ff,#b36bff);-webkit-background-clip:text;background-clip:text}
@keyframes bannerIn{0%{transform:translate(-50%,-50%) scale(2.6) rotate(-8deg);opacity:0}15%{transform:translate(-50%,-50%) scale(.9) rotate(2deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1.06)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.fevercard .bar i{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47ff9a,#4fc3ff,#b36bff);background-size:200% 100%;animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:200% 0}}
#game.fever #board{animation:feverB .5s ease-in-out infinite alternate}
@keyframes feverB{from{box-shadow:0 0 0 4px #ff6fd8,0 0 0 7px #8a2a7a,0 0 30px #ff6fd8}to{box-shadow:0 0 0 4px #4fc3ff,0 0 0 7px #1a5a8a,0 0 40px #47ff9a}}
#game.fever::before{content:"";position:fixed;inset:0;pointer-events:none;background:conic-gradient(from 0deg at 50% 50%,#ff5f6d22,#ffc37122,#47ff9a22,#4fc3ff22,#b36bff22,#ff5f6d22);animation:spin 4s linear infinite;transform-origin:50% 50%;scale:2}
#game.fever .fevercard{box-shadow:0 0 18px #ff6fd8}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.15)}}
#timeBar.low~*,#timeTxt.low{color:#ff8a8a}
#timeTxt.low{animation:bump .5s infinite}
.bigstars span{display:inline-block;animation:starIn .5s backwards}
@keyframes starIn{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.4)}}
/* ---- skill cut-in ---- */
.cutin{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;border-radius:14px}
.cutin::before{content:"";position:absolute;inset:0;background:#0b0620;animation:ciDim var(--dur) forwards}
@keyframes ciDim{0%{opacity:0}15%{opacity:.55}75%{opacity:.4}100%{opacity:0}}
.ci-band{position:absolute;left:-10%;right:-10%;top:28%;height:44%;transform:skewY(-10deg);
 background:repeating-linear-gradient(90deg,#ffffff40 0 2px,transparent 2px 26px),linear-gradient(90deg,transparent,var(--cc) 18%,var(--cc2) 82%,transparent);
 box-shadow:0 0 40px var(--cc);animation:ciBand var(--dur) ease forwards,ciLines .3s linear infinite}
@keyframes ciBand{0%{transform:skewY(-10deg) scaleY(0)}12%{transform:skewY(-10deg) scaleY(1)}78%{opacity:.95}100%{transform:skewY(-10deg) scaleY(.2);opacity:0}}
@keyframes ciLines{to{background-position:-52px 0,0 0}}
.ci-hero{position:absolute;left:-4%;top:14%;width:62%;height:70%;animation:ciHero var(--dur) cubic-bezier(.2,.9,.3,1) forwards}
.cutin.mini .ci-hero{width:48%;top:22%;height:56%}
.ci-hero svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px #0008)}
@keyframes ciHero{0%{transform:translateX(-115%) scale(.9);opacity:1}20%{transform:translateX(0) scale(1)}72%{transform:translateX(5%) scale(1.03);opacity:1}100%{transform:translateX(-130%);opacity:0}}
.ci-sword{transform-box:view-box;transform-origin:138px 104px;animation:ciSwing var(--dur) forwards}
@keyframes ciSwing{0%,26%{transform:rotate(-80deg)}44%{transform:rotate(100deg)}100%{transform:rotate(100deg)}}
.ci-trail{transform-box:view-box;transform-origin:138px 104px;opacity:0;animation:ciTrail var(--dur) forwards}
@keyframes ciTrail{0%,30%{opacity:0}40%{opacity:1}60%{opacity:0}100%{opacity:0}}
.ci-text{position:absolute;right:5%;top:33%;text-align:right;animation:ciText var(--dur) cubic-bezier(.2,.9,.3,1) forwards}
.ci-in b{display:block;font-size:calc(var(--s)*.72);font-weight:900;color:#fff;text-shadow:0 3px 0 var(--cc),0 0 12px #000}
.ci-in span{display:inline-block;margin-top:2px;font-size:calc(var(--s)*.36);font-weight:800;color:#3a2066;background:linear-gradient(90deg,#fff,#ffe9a8);padding:2px 10px;border-radius:6px;transform:skewX(-10deg)}
.cutin.mini .ci-in b{font-size:calc(var(--s)*.55)}
@keyframes ciText{0%{transform:translateX(130%);opacity:1}22%{transform:translateX(0)}78%{opacity:1}100%{opacity:0;transform:translateX(-8%)}}
.ci-slash{position:absolute;left:-10%;top:50%;width:120%;height:7px;border-radius:7px;background:linear-gradient(90deg,transparent,#fff 25%,#fff 75%,transparent);
 box-shadow:0 0 16px #fff,0 0 40px var(--cc),0 0 70px var(--cc2);transform:rotate(-26deg) scaleX(0);animation:ciSlash var(--dur) forwards}
@keyframes ciSlash{0%,40%{transform:rotate(-26deg) scaleX(0)}52%{transform:rotate(-26deg) scaleX(1);height:7px;opacity:1}100%{transform:rotate(-26deg) scaleX(1);opacity:0;height:0}}
.cutin.rt{transform:scaleX(-1)}.cutin.rt .ci-in{transform:scaleX(-1);text-align:left}
.cutin.rt .ci-text{top:auto;bottom:16%}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <radialGradient id="gA" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#d4f3ff"/><stop offset=".45" stop-color="#4bb4f5"/><stop offset="1" stop-color="#1b5fc0"/></radialGradient>
  <radialGradient id="gL" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef1fa"/><stop offset="1" stop-color="#a4b0d4"/></radialGradient>
  <radialGradient id="gS" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#fff8c2"/><stop offset=".5" stop-color="#ffd43b"/><stop offset="1" stop-color="#ee8a0f"/></radialGradient>

  g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);

const pcv=$('#pfx'),pctx=pcv.getContext('2d');let parts=[],pRun=false,DPR=1;

function burst(x,y,cols,n=8,spd=4,opt={}){
 if(parts.length>1200)return;
 for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(opt.up||1.5),g:opt.g??.18,life:1,decay:.018+Math.random()*.025,
   size:(opt.size||1)*(2+Math.random()*4),col:cols[rnd(cols.length)],shape:opt.shape||(Math.random()<.45?'star':'shard'),rot:Math.random()*6,vr:(Math.random()-.5)*.4});}
 loopP();}
function ring(x,y,col,max=1){parts.push({ring:true,x,y,r:4,max:S*max,life:1,decay:.05,col});loopP();}
function confetti(n=120){for(let k=0;k<n;k++)parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.05,life:1,decay:.006,size:5+Math.random()*5,col:CONF[rnd(6)],shape:'conf',rot:Math.random()*6,vr:(Math.random()-.5)*.3});loopP();}
function loopP(){if(!pRun){pRun=true;requestAnimationFrame(stepP);}}
function stepP(){
 pctx.setTransform(DPR,0,0,DPR,0,0);pctx.clearRect(0,0,innerWidth,innerHeight);
 pctx.globalCompositeOperation='lighter';
 parts=parts.filter(q=>{q.life-=q.decay;if(q.life<=0)return false;pctx.globalAlpha=Math.min(1,q.life*1.4);
  if(q.ring){q.r+=(q.max-q.r)*.18;pctx.strokeStyle=q.col;pctx.lineWidth=4*q.life;pctx.beginPath();pctx.arc(q.x,q.y,q.r,0,7);pctx.stroke();return true;}
  q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.vx*=.98;q.rot+=q.vr;pctx.fillStyle=q.col;pctx.save();pctx.translate(q.x,q.y);pctx.rotate(q.rot);
  if(q.shape==='star'){const s=q.size*1.3;pctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?s*.35:s;const a=i*Math.PI/4;pctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}pctx.fill();}
  else if(q.shape==='conf'){pctx.globalCompositeOperation='source-over';pctx.fillRect(-q.size/2,-q.size/4,q.size,q.size/2);pctx.globalCompositeOperation='lighter';}
  else pctx.fillRect(-q.size/2,-q.size/2,q.size,q.size*.6);
  pctx.restore();return true;});
 pctx.globalAlpha=1;
 if(parts.length)requestAnimationFrame(stepP);else{pRun=false;pctx.clearRect(0,0,innerWidth,innerHeight);}
}

/* ================= MATCHING ================= */
function findGroups(){
 const runs=[];
 for(let r=0;r<H;r++){let c=0;while(c<W){const p=grid[r][c];if(!isHero(p)){c++;continue;}let e=c+1;while(e<W&&isHero(grid[r][e])&&grid[r][e].type===p.type)e++;
  if(e-c>=3){const cs=[];for(let k=c;k<e;k++)cs.push(idx(r,k));runs.push(cs);}c=e;}}
 for(let c=0;c<W;c++){let r=0;while(r<H){const p=grid[r][c];if(!isHero(p)){r++;continue;}let e=r+1;while(e<H&&isHero(grid[e][c])&&grid[e][c].type===p.type)e++;
  if(e-r>=3){const cs=[];for(let k=r;k<e;k++)cs.push(idx(k,c));runs.push(cs);}r=e;}}
 if(!runs.length) return [];
 const par=new Map();const find=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
 for(const run of runs)for(const i of run)if(!par.has(i))par.set(i,i);
 for(const run of runs)for(let k=1;k<run.length;k++){const a=find(run[0]),b=find(run[k]);if(a!==b)par.set(a,b);}
 const gs=new Map();
 for(const run of runs){const root=find(run[0]);if(!gs.has(root))gs.set(root,{cells:new Set(),maxRun:0,type:at(run[0]).type});const g=gs.get(root);run.forEach(i=>g.cells.add(i));g.maxRun=Math.max(g.maxRun,run.length);}
 return [...gs.values()];
}
function groupsToPending(groups,prefer=[]){
 const pend={clear:new Set(),triggers:[],create:[]};
 for(const g of groups){
  const lv=g.maxRun>=5?3:(g.maxRun>=4||g.cells.size>=5?2:1);
  if(lv>1){let pos=prefer.find(i=>g.cells.has(i)&&at(i).lv===1);
   if(pos===undefined){const l1=[...g.cells].filter(i=>at(i).lv===1);if(l1.length)pos=l1[Math.floor(l1.length/2)];}
   if(pos!==undefined)pend.create.push({i:pos,lv});}
  g.cells.forEach(i=>pend.clear.add(i));
 }
 pend.create.forEach(cr=>pend.clear.delete(cr.i));
 return pend;
}
const sameAt=(r,c,t)=>inB(r,c)&&isHero(grid[r][c])&&grid[r][c].type===t;
function matchAt(r,c){const p=grid[r][c];if(!isHero(p))return false;const t=p.type;
 let n=1;for(let k=c-1;sameAt(r,k,t);k--)n++;for(let k=c+1;sameAt(r,k,t);k++)n++;if(n>=3)return true;
 n=1;for(let k=r-1;sameAt(k,c,t);k--)n++;for(let k=r+1;sameAt(k,c,t);k++)n++;return n>=3;}
function hasMoves(){
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];if(isHero(p)&&p.lv>1)return true;}
 for(let r=0;r<H;r++)for(let c=0;c<W;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;
  const a=grid[r][c],b=grid[r2][c2];if(!isHero(a)||!isHero(b)||a.type===b.type)continue;
  grid[r][c]=b;grid[r2][c2]=a;const ok=matchAt(r,c)||matchAt(r2,c2);grid[r][c]=a;grid[r2][c2]=b;if(ok)return true;}
 return false;
}

function activate(p,r,c,dir,player){
 const cells=[];let time=0,refresh=false,delay=130;
 if(!dir)dir=DIRS[rnd(4)];
 const lineExt=(n)=>{let rr=r+dir[0],cc=c+dir[1];while(inB(rr,cc)&&cells.length<n){cells.push(idx(rr,cc));rr+=dir[0];cc+=dir[1];}
  rr=r-dir[0];cc=c-dir[1];while(inB(rr,cc)&&cells.length<n){cells.push(idx(rr,cc));rr-=dir[0];cc-=dir[1];}};
 const col='c'+p.type;
 if(p.type===0){
  const crit=Math.random()<.25;
  if(p.lv===2){lineExt(crit?8:6);}
  else{const R=crit?3:2;for(let dr=-R;dr<=R;dr++)for(let dc=-R;dc<=R;dc++){if((dr||dc)&&(crit?true:Math.abs(dr)+Math.abs(dc)<=R)&&inB(r+dr,c+dc))cells.push(idx(r+dr,c+dc));}}
  if(crit){cellText(r,c,'คริติคอล!','gold');shake(5);}
  if(p.lv===3){shake(7);const[x,y]=boardXY(r,c);ring(x,y,'#5cd0ff',3);}
  cells.forEach((i,k)=>{const[a,b]=rc(i);cellFx(a,b,col,k*25);});beep(520,.15,'triangle');
 }else if(p.type===1){
  if(p.lv===2)lineExt(4);
  else{for(let k=0;k<W;k++)if(k!==c)cells.push(idx(r,k));for(let k=0;k<H;k++)if(k!==r)cells.push(idx(k,c));}
  const need=p.lv===2?2:3;const luna=cells.filter(i=>{const q=at(i);return isHero(q)&&q.type===1;}).length;
  if(player&&luna>=need){refresh=true;setTimeout(()=>cellText(r,c,'รีเฟรช!','gold'),150);}
  cells.forEach((i,k)=>{const[a,b]=rc(i);cellFx(a,b,col,k*30);});beep(880,.12,'sine');
 }else if(p.type===2){
  const ns=p.lv===2?DIRS:DIRS.concat(DIAG);ns.forEach(([dr,dc])=>{if(inB(r+dr,c+dc))cells.push(idx(r+dr,c+dc));});
  time=p.lv===2?2:4;cellText(r,c,'+'+time+' วิ','gold');
  cells.forEach(i=>{const[a,b]=rc(i);cellFx(a,b,col);});cellFx(r,c,col);beep(660,.2,'square',.03);
 }else{
  const n=p.lv===2?2:4;const obsCells=[];
  for(let a=0;a<H;a++)for(let b=0;b<W;b++)if(grid[a][b]&&grid[a][b].kind==='obs')obsCells.push([a,b]);
  for(let k=0;k<n;k++){let tr,tc;if(obsCells.length&&Math.random()<.5){[tr,tc]=obsCells[rnd(obsCells.length)];}else{tr=rnd(H);tc=rnd(W);}
   droneFx(r,c,tr,tc);[[0,0]].concat(DIRS).forEach(([dr,dc])=>{if(inB(tr+dr,tc+dc)){cells.push(idx(tr+dr,tc+dc));cellFx(tr+dr,tc+dc,col,330);}});}
  delay=420;beep(300,.3,'sawtooth',.03);setTimeout(()=>shake(p.lv===3?8:4),340);
 }
 return {cells,time,refresh,delay};
}

/* ================= RESOLUTION ================= */
async function processClear(pend,cascade){
 const clear=new Set(),protect=new Set(pend.create.map(x=>x.i)),dmg=new Map(),triggered=new Set();
 const queue=[...pend.triggers];let timeBonus=0,cut=false;
 const hit=i=>dmg.set(i,(dmg.get(i)||0)+1);
 const add=i=>{if(protect.has(i))return;const p=at(i);if(!p)return;if(p.kind==='obs'){hit(i);return;}
  if(clear.has(i))return;clear.add(i);if(p.lv>1&&!triggered.has(i))queue.push({i,dir:null,player:false});};
 pend.clear.forEach(add);
 while(queue.length){
  const t=queue.shift();if(triggered.has(t.i))continue;triggered.add(t.i);
  const p=at(t.i);if(!isHero(p)||p.lv<2)continue;const[r,c]=rc(t.i);
  if(t.player&&!cut){cut=true;await cutIn(p.type,p.lv);}
  clear.add(t.i);
  const eff=activate(p,r,c,t.dir,t.player);
  timeBonus+=eff.time;eff.cells.forEach(add);
  if(eff.refresh){clear.delete(t.i);protect.add(t.i);}
  await wait(eff.delay);
 }
 for(const i of clear){const[r,c]=rc(i);for(const[dr,dc]of DIRS){const rr=r+dr,cc=c+dc;if(inB(rr,cc)){const q=grid[rr][cc];if(q&&q.kind==='obs'&&!clear.has(idx(rr,cc)))hit(idx(rr,cc));}}}
 const mult=(1+.5*cascade)*(G.fever>0?2:1);let gained=0,sr=0,sc=0,n=0;
 for(const i of clear){const[r,c]=rc(i);const p=grid[r][c];if(!p)continue;grid[r][c]=null;popEl(p);{const[x,y]=boardXY(r,c);burst(x,y,PCOL[p.type],clear.size>20?4:7,3.5);if(p.lv>1)ring(x,y,PCOL[p.type][0],1.5);}
  gained+=Math.round(100*mult*(p.lv>1?2:1));sr+=r;sc+=c;n++;}
 if(n)beep(400+cascade*120,.09,'sine',.05);
 if(n>=15){shake(Math.min(12,n/3));flash();}
 if(n&&G.fever<=0){G.fg+=n*1.4*(1+cascade*.4);if(G.fg>=100){G.fg=0;startFever();}}
 for(const cr of pend.create){const p=at(cr.i);if(isHero(p)){p.lv=Math.max(p.lv,cr.lv);render(p);flashClass(p,'up',500);cellFx(p.r,p.c,'c'+p.type);gained+=cr.lv*250;{const[x,y]=boardXY(p.r,p.c);ring(x,y,'#fff',1.4);burst(x,y,['#fff','#ffe36b'],12,3,{shape:'star'});}}}
 if(pend.create.length)beep(990,.18,'triangle',.05);
 if(gained){addScore(gained);if(n)floatText((sc/n+.5)*S,(sr/n+.5)*S,'+'+gained);}
 if(timeBonus)addTime(timeBonus);
 const angry=[];
 for(const[i,h]of dmg){const p=at(i);if(!p||p.kind!=='obs')continue;hitObs(p,h,angry);}
 await wait(n?230:120);
 for(const b of angry){if(at(idx(b.r,b.c))===b)await bossSkill(b);}
}
function hitObs(p,h,angry){
 p.hp-=h;
 if(p.hp<=0){const o=OBS[p.type];grid[p.r][p.c]=null;cellFx(p.r,p.c,'boom');popEl(p);addScore(o.pts);{const[x,y]=boardXY(p.r,p.c);burst(x,y,['#ffb02e','#ff4f7b','#fff','#ffe36b'],p.type==='boss'?60:26,p.type==='boss'?8:5,{size:1.4});ring(x,y,'#ffb02e',p.type==='boss'?5:2.5);shake(p.type==='boss'?16:p.maxhp>1?9:3);if(p.maxhp>1)flash('#ffe9b0');}
  cellText(p.r,p.c,'+'+o.pts,'gold');beep(220,.3,'square',.05);
  if(p.type==='ember'){G.powers.ember=40;centerText('🔥 พลังเพลิง 40 วิ!');}
  if(p.type==='frost'){G.powers.frost=40;centerText('❄️ พลังปัญญา 40 วิ!');}
  if(p.type==='boss')centerText('ปราบจอมมารเงาสำเร็จ!');
  if(p.type==='lizard')cellText(p.r,p.c,'จับได้แล้ว!','gold');
  if(G.stage.endless&&p.type!=='rock')addTime(p.type==='boss'?10:3);
  return;}
 render(p);flashClass(p,'hit',260);{const[x,y]=boardXY(p.r,p.c);burst(x,y,['#fff','#ffcf6b'],4,2.5);}
 if(p.type==='boss'){while(p.hp<=p.nextSkill&&p.nextSkill>0){p.nextSkill-=10;angry.push(p);}}
}
async function bossSkill(b){

async function gravity(){

 for(let c=0;c<W;c++){let w=H-1;
  for(let r=H-1;r>=0;r--){const p=grid[r][c];if(p){if(w!==r){grid[w][c]=p;grid[r][c]=null;const d=.1+.045*(w-r);maxD=Math.max(maxD,d);setPos(p,w,c,d);}w--;}}
  let k=1;for(let r=w;r>=0;r--){const p=newHero(rnd(4),G&&G.fever>0&&Math.random()<.07?2:1);grid[r][c]=p;render(p);setPosInstant(p,-k,c);const d=.1+.045*(r+k);maxD=Math.max(maxD,d);setPos(p,r,c,d);k++;}
 }

 }

 if(G.powers.frost>0){const cand=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];if(isHero(p)&&p.lv<3)cand.push(p);}

async function moveLizards(){

 for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];if(p&&p.type==='lizard')liz.push(p);}
 for(const p of liz){const r=p.r,c=p.c;let nr=r+p.dir;
  if(!inB(nr,c)||!isHero(grid[nr][c])){p.dir*=-1;nr=r+p.dir;}
  if(!inB(nr,c)||!isHero(grid[nr][c]))continue;
  const q=grid[nr][c];grid[nr][c]=p;grid[r][c]=q;setPos(p,nr,c,.2);setPos(q,r,c,.2);moved=true;}

async function shuffle(){

 let tries=0;

 do{for(let i=pcs.length-1;i>0;i--){const j=rnd(i+1);[pcs[i],pcs[j]]=[pcs[j],pcs[i]];}assign();tries++;

function buildBoard(stage){
 boardEl.innerHTML='';fxEl.innerHTML='';
 grid=Array.from({length:H},()=>Array(W).fill(null));
 for(const[t,n]of Object.entries(stage.obs))for(let k=0;k<n;k++){let r,c;
  do{r=t==='boss'?2+rnd(3):1+rnd(H-1);c=t==='boss'?2+rnd(4):rnd(W);}while(grid[r][c]);grid[r][c]=newObs(t);}
 let ok=false,tries=0;
 while(!ok&&tries<100){tries++;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(grid[r][c]&&grid[r][c].kind==='obs')continue;
   let t,g=0;do{t=rnd(4);g++;}while(g<20&&((sameAt(r,c-1,t)&&sameAt(r,c-2,t))||(sameAt(r-1,c,t)&&sameAt(r-2,c,t))));grid[r][c]=newHero(t);}
  ok=!findGroups().length&&hasMoves();}
 for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];render(p);setPosInstant(p,r-H-1,c);p.r=r;p.c=c;}
 requestAnimationFrame(()=>{for(let r=0;r<H;r++)for(let c=0;c<W;c++)setPos(grid[r][c],r,c,.35+(H-r)*.04+c*.01);});
}
function spawnRandomObstacle(){
 const hasBoss=grid.some(row=>row.some(p=>p&&p.type==='boss'));
 const pool=['rock','rock','lizard','ember','frost'];if(!hasBoss&&G.timeMax-G.time>30)pool.push('boss');
 const t=pool[rnd(pool.length)];
 const cand=[];for(let r=0;r<H;r++)for(let c=0;c<W;c++){const p=grid[r][c];if(isHero(p)&&p.lv===1)cand.push([r,c]);}
 if(!cand.length)return;const[r,c]=cand[rnd(cand.length)];popEl(grid[r][c]);
 const o=newObs(t);grid[r][c]=o;render(o);setPosInstant(o,r,c);o.r=r;o.c=c;flashClass(o,'up');cellFx(r,c,'dark');
 toast(OBS[t].name+' ปรากฏตัว!');
}

function findMove(){
 for(let r=0;r<H;r++)for(let c=0;c<W;c++)for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(!inB(r2,c2))continue;
  const a=grid[r][c],b=grid[r2][c2];if(!isHero(a)||!isHero(b)||a.type===b.type)continue;
  grid[r][c]=b;grid[r2][c2]=a;const ok=matchAt(r,c)||matchAt(r2,c2);grid[r][c]=a;grid[r2][c2]=b;if(ok)return[a,b];}
 for(const row of grid)for(const p of row)if(isHero(p)&&p.lv>1)return[p];
 return [];}

let drag=null,selEl=null;
function cellFromEvent(e){const rect=boardEl.getBoundingClientRect();return[Math.floor((e.clientY-rect.top)/S),Math.floor((e.clientX-rect.left)/S)];}
boardEl.addEventListener('pointerdown',e=>{
 if(busy||!G||!G.running||G.paused||G.ended)return;
 const[r,c]=cellFromEvent(e);if(!inB(r,c))return;
 clearHint();
 drag={r,c,x:e.clientX,y:e.clientY,done:false};
 try{boardEl.setPointerCapture(e.pointerId);}catch(_){}

});
boardEl.addEventListener('pointermove',e=>{

});

async function doSwap(r1,c1,r2,c2){
 if(!inB(r2,c2))return;
 const a=grid[r1][c1],b=grid[r2][c2];
 if(!isHero(a)||!isHero(b)){flashClass(a,'nudge',300);flashClass(b,'nudge',300);return;}
 grid[r1][c1]=b;grid[r2][c2]=a;setPos(a,r2,c2,.15);setPos(b,r1,c1,.15);beep(500,.05);await wait(170);
 const dir=[r2-r1,c2-c1];
 if(a.lv>1&&b.lv>1){const both3=a.lv===3&&b.lv===3;const cl=new Set();
  if(both3){for(let r=0;r<H;r++)for(let c=0;c<W;c++)cl.add(idx(r,c));banner('ล้างกระดาน!!','huge fever');}
  else{for(let k=-1;k<=1;k++){for(let c=0;c<W;c++)if(inB(r2+k,c))cl.add(idx(r2+k,c));for(let r=0;r<H;r++)if(inB(r,c2+k))cl.add(idx(r,c2+k));}banner('สุดยอดคอมโบ!','huge');}
  await Promise.all([cutIn(a.type,3,{full:true,label:'สุดยอดคอมโบ!'}),cutIn(b.type,3,{full:true,right:true,label:both3?'ล้างทั้งกระดาน!':'คอมโบคู่!'})]);
  a.lv=1;b.lv=1;render(a);render(b);setPos(a,r2,c2,0);setPos(b,r1,c1,0);
  flash();shake(16);{const[x,y]=boardXY(r2,c2);ring(x,y,'#fff',6);burst(x,y,CONF,70,9,{size:1.5});}beep(200,.5,'sawtooth',.07);
  addScore(both3?5000:1500);await wait(350);
  await runAction({clear:cl,triggers:[],create:[]});await afterMove();return;}
 const groups=findGroups();
 const trig=[];if(a.lv>1)trig.push({i:idx(r2,c2),dir,player:true});if(b.lv>1)trig.push({i:idx(r1,c1),dir:[-dir[0],-dir[1]],player:true});
 if(!groups.length&&!trig.length){grid[r1][c1]=a;grid[r2][c2]=b;setPos(a,r1,c1,.15);setPos(b,r2,c2,.15);beep(180,.1,'square',.03);
  boardEl.classList.add('shake');setTimeout(()=>boardEl.classList.remove('shake'),300);await wait(170);return;}
 const pend=groups.length?groupsToPending(groups,[idx(r2,c2),idx(r1,c1)]):{clear:new Set(),triggers:[],create:[]};
 pend.triggers=trig;
 await runAction(pend);await afterMove();
}

 if(m==='bolt'){if(!isHero(p)||p.lv>=3){toast('เลือกลูกอมฮีโร่ที่ยังไม่ถึง Lv.3');return;}

  G.items.clock--;G.itemMode=null;updateHUD();const t=p.type;const cl=new Set();
  for(let a=0;a<H;a++)for(let b=0;b<W;b++){const q=grid[a][b];if(isHero(q)&&q.type===t){cl.add(idx(a,b));cellFx(a,b,'c'+t,(Math.abs(a-r)+Math.abs(b-c))*30);}}
  beep(700,.3,'sine');await wait(250);await runAction({clear:cl,triggers:[],create:[]});await afterMove();return;}
 if(m==='bomb'){G.items.bomb--;G.itemMode=null;updateHUD();const cl=new Set();
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(inB(r+dr,c+dc)){cl.add(idx(r+dr,c+dc));cellFx(r+dr,c+dc,'boom');}
  shake(12);flash('#ffd0a0');{const[x,y]=boardXY(r,c);burst(x,y,['#ffb02e','#ff4f7b','#fff'],40,7);ring(x,y,'#ffb02e',2.5);}beep(150,.35,'sawtooth',.06);await runAction({clear:cl,triggers:[],create:[]});await afterMove();}
}
document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{
 if(!G||!G.running||busy)return;const k=b.dataset.item;if(G.items[k]<=0)return;
 G.itemMode=G.itemMode===k?null:k;
 $('#hint').textContent=G.itemMode?('ใช้ '+ITEMS[k].name+': แตะเลือกบนกระดาน (แตะไอเทมอีกครั้งเพื่อยกเลิก)'):'ลากเพื่อสลับ • แตะลูกอม Lv.2/3 เพื่อใช้สกิล';
 updateHUD();
});

/* ================= MENU / MODALS ================= */
function buildMenu(){
 $('#mascots').innerHTML=HERO_SVG.join('');
 $('#path').innerHTML=STAGES.map((st,i)=>{
  const locked=i>0&&i<5&&!(SAVE.stars[i-1]>0);
  const s=i<5?[0,1,2].map(k=>k<(SAVE.stars[i]||0)?'★':'<span class="off">★</span>').join(''):'';
  const next=!locked&&i<5&&!(SAVE.stars[i]>0);
  return `<div class="node${locked?' locked':''}${next?' next':''}"><button data-i="${i}">${st.num}</button><div class="stars">${s}</div><div class="nm">${st.name}</div></div>`;}).join('');
 $('#path').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(b.parentElement.classList.contains('locked')){toast('ผ่านด่านก่อนหน้าเพื่อปลดล็อก');return;}
  startStage(+b.dataset.i);});
 $('#bestTxt').textContent=SAVE.best?'🏆 สถิติโหมดไม่สิ้นสุด: '+SAVE.best.toLocaleString():'';
 $('#cutBtn').textContent=SAVE.cutins===false?'🎬 ฉากสกิล: ปิด':'🎬 ฉากสกิล: เปิด';
 $('#muteBtn').textContent=SAVE.muted?'🔇 เสียง: ปิด':'🔊 เสียง: เปิด';
}
function toMenu(){G=null;busy=false;['pauseM','resultM','introM'].forEach(m=>modal(m,false));buildMenu();show('menu');}
$('#cutBtn').onclick=()=>{SAVE.cutins=SAVE.cutins===false;save();buildMenu();};
$('#muteBtn').onclick=()=>{SAVE.muted=!SAVE.muted;save();buildMenu();};
$('#backBtn').onclick=$('#pauseBtn').onclick=()=>{if(!G||G.ended)return;G.paused=true;modal('pauseM',true);};
$('#resumeBtn').onclick=()=>{G.paused=false;modal('pauseM',false);};
$('#restartBtn').onclick=()=>{modal('pauseM',false);startStage(stageIdx);};
$('#quitBtn').onclick=toMenu;
$('#menuBtn').onclick=toMenu;
$('#againBtn').onclick=()=>{modal('resultM',false);startStage(stageIdx);};
$('#nextBtn').onclick=()=>{modal('resultM',false);startStage(Math.min(stageIdx+1,5));};

let helpWasPaused=false;
function openHelp(){if(G&&G.running){helpWasPaused=G.paused;G.paused=true;}renderGuide('h');modal('helpM',true);}
$('#helpBtn').onclick=$('#helpBtn2').onclick=openHelp;
$('#closeHelp').onclick=()=>{modal('helpM',false);if(G&&G.running&&!$('#pauseM').classList.contains('on'))G.paused=helpWasPaused;};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>renderGuide(t.dataset.t));
function renderGuide(t){
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
 let h='';
 if(t==='h'){h+=`<div class="gi"><div><b>พื้นฐาน</b><p>ลากสลับลูกอมที่อยู่ติดกันให้เรียงชนิดเดียวกัน <em>3 ลูก</em> ขึ้นไปเพื่อทำลาย<br>เรียง <em>4 ลูก</em> (หรือรูปตัว L/T) = ได้ลูกอม <em>Lv.2</em> • เรียง <em>5 ลูก</em> = ได้ลูกอม <em>Lv.3</em><br>แตะลูกอม Lv.2/3 เพื่อใช้สกิล หรือลากสลับเพื่อเลือกทิศทาง • คอมโบต่อเนื่องได้คะแนนคูณเพิ่ม</p></div></div><div class="gi"><div><b>🌈 FEVER</b><p>ทำลายลูกอมจนเกจเต็ม เข้าโหมด FEVER <em>8 วิ</em>: คะแนน <em>x2</em> และลูกอมที่ตกลงมามีโอกาสเป็น Lv.2</p></div></div><div class="gi"><div><b>💥 สุดยอดคอมโบ</b><p>ลากสลับลูกอม Lv.2/3 สองลูกเข้าหากัน = ระเบิดกากบาทกว้าง 3 แถว<br>สลับ <em>Lv.3 + Lv.3</em> = <em>ล้างทั้งกระดาน!</em></p></div></div>`;
  HEROES.forEach((x,i)=>h+=`<div class="gi">${HERO_SVG[i]}<div><b>${x.name}</b> (${x.col})<p><b>Lv.2:</b> ${x.lv2}<br><b>Lv.3:</b> ${x.lv3}</p></div></div>`);}
 if(t==='o')Object.keys(OBS).forEach(k=>h+=`<div class="gi">${OBS_SVG[k]}<div><b>${OBS[k].name}</b><p>${OBS[k].desc}<br>กำจัดได้ <em>+${OBS[k].pts.toLocaleString()}</em> คะแนน</p></div></div>`);
 if(t==='i'){Object.keys(ITEMS).forEach(k=>h+=`<div class="gi">${ITEM_SVG[k]}<div><b>${ITEMS[k].name}</b><p>${ITEMS[k].desc} เมื่อใช้แล้วไม่สามารถยกเลิกได้</p></div></div>`);
  h+=`<div class="gi"><div><p>ทุกด่านเริ่มด้วย สายฟ้า 3 • นาฬิกา 2 • ระเบิด 3 ชิ้น</p></div></div>`;}
 $('#guide').innerHTML=h;
}
$('#bgfloat').innerHTML=Array.from({length:14},(_,k)=>{const sz=30+rnd(60);return HERO_SVG[k%4].replace('<svg ',`<svg style="left:${rnd(100)}%;width:${sz}px;height:${sz}px;animation-duration:${14+rnd(16)}s;animation-delay:-${rnd(30)}s" `);}).join('');
$('#icBolt').innerHTML=ITEM_SVG.bolt;$('#icClock').innerHTML=ITEM_SVG.clock;$('#icBomb').innerHTML=ITEM_SVG.bomb;
/* ================= LEADERBOARD (server or local) ================= */
const NET={online:false};let lbStage=0;
const myName=()=>(($('#nameIn').value||'').trim().slice(0,16))||'ผู้เล่น';
$('#nameIn').value=SAVE.name||'';
$('#nameIn').oninput=()=>{SAVE.name=$('#nameIn').value.trim().slice(0,16);save();};
function setNet(on){NET.online=on;const e=$('#netTxt');e.textContent=on?'🟢 ออนไลน์ (เซิร์ฟเวอร์)':'⚪ ออฟไลน์ (เก็บในเครื่อง)';e.classList.toggle('on',on);}
setNet(false);
if(location.protocol.startsWith('http'))fetch('api/scores?stage=0',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.scores))setNet(true);}).catch(()=>{});
function localBoard(st){try{return JSON.parse(localStorage.getItem('heroPopLB'+st)||'[]');}catch(e){return [];}}
async function submitScore(st,score,stars){
 const entry={name:myName(),stage:st,score,stars,time:Date.now()};
 if(NET.online){try{const r=await fetch('api/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)});
  if(r.ok){const j=await r.json();return j.rank;}}catch(e){}}
 const b=localBoard(st);b.push(entry);b.sort((a,c)=>c.score-a.score);const top=b.slice(0,20);
 try{localStorage.setItem('heroPopLB'+st,JSON.stringify(top));}catch(e){}
 const k=top.indexOf(entry);return k>=0?k+1:0;
}
async function getBoard(st){
 if(NET.online){try{const r=await fetch('api/scores?stage='+st,{cache:'no-store'});if(r.ok)return (await r.json()).scores;}catch(e){}}
 return localBoard(st).slice(0,10);
}
const esc=t=>String(t).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function showLb(st){
 lbStage=st;
 $('#lbTabs').innerHTML=STAGES.map((x,i)=>`<button class="tab${i===st?' on':''}" data-s="${i}">${x.num}</button>`).join('');
 $('#lbTabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>showLb(+b.dataset.s));
 $('#lbMode').textContent=STAGES[st].name+(NET.online?' • คะแนนรวมทุกคนบนเซิร์ฟเวอร์':' • คะแนนในเครื่องนี้ (รันเซิร์ฟเวอร์เพื่อแข่งกับเพื่อน)');
 $('#lbBody').innerHTML='<tr><td colspan="4">กำลังโหลด…</td></tr>';
 const rows=await getBoard(st);const me=myName();
 $('#lbBody').innerHTML=rows.length?rows.map((e,i)=>`<tr class="${e.name===me?'me':''}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(e.name)}</td><td>${Number(e.score).toLocaleString()}</td><td>${STAGES[st].endless?'':'★'.repeat(e.stars||0)}</td></tr>`).join(''):'<tr><td colspan="4">ยังไม่มีคะแนน มาเป็นคนแรกกัน!</td></tr>';
 modal('lbM',true);
}
$('#lbBtn').onclick=()=>showLb(lbStage);
$('#resLbBtn').onclick=()=>showLb(lbStage);
$('#closeLb').onclick=()=>modal('lbM',false);

buildMenu();
window.__hp={get grid(){return grid},get G(){return G},startStage,doSwap,doTap,act,findGroups,hasMoves,get busy(){return busy}};
})();
</script>
</body>
